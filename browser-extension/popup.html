<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Piano Uploader Search Companion</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Capture sheet music links</h1><p>Search Musicnotes or MuseScore in this tab. Capture the loaded score links, then import the JSON file into Piano Uploader.</p>
